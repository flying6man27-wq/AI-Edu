# Firebase Hosting 부분 배포 (PC 없이 휴대폰 GitHub 앱에서 실행)
#
# 왜 부분 배포인가: PC 에서 커밋 없이 배포한 변경이 라이브에만 있을 수 있다(2026-09-23 실측 —
# 관리자 화면·심화캠프 보고서 2건과 산출물 파일이 라이브에만 있었다). 저장소 public/ 을 통째로
# 배포하면 그 변경이 되돌아가고 라이브에만 있는 파일은 삭제된다. 그래서 여기서는
#   현재 라이브 버전을 그대로 복제 → 지정한 파일(files 입력)만 저장소 내용으로 교체 → 릴리스
# 한다. 그 밖의 파일은 라이브 그대로 유지된다. Firestore 규칙은 건드리지 않는다.
#
# 1) 대조(항상, 자격증명 불필요): 라이브와 public/ 의 차이를 로그로 보여준다(참고용, 차단 안 함).
# 2) 배포(deploy=true 일 때만): 키 파일 없이 Workload Identity Federation 으로 인증한다.
#    (조직 정책 iam.disableServiceAccountKeyCreation 으로 서비스 계정 키 발급이 막혀 있다 — 2026-09-23)
#    GitHub 가 발급한 OIDC 토큰을 Google 이 직접 검증하므로 저장소에 비밀값이 없다.
#    Google 쪽 준비(1회): 풀 github / 공급자 ai-edu (이 저장소의 main 브랜치만 허용),
#    서비스 계정 gh-hosting-deploy@ai-edu-seco (roles/firebasehosting.admin).
name: deploy-hosting

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "true 면 대조 통과 후 실제 배포, false 면 대조만"
        required: true
        default: "false"
      expected_changes:
        description: "이번에 교체 배포할 파일(public/ 기준, 쉼표 구분)"
        required: false
        default: "onboarding/index.html"
      live_sha1:
        description: "(선택) 교체 대상 라이브 파일을 사람이 직접 대조했을 때 그 SHA-1. 저장소 커밋과 달라도 이 값과 같으면 교체 허용"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write   # GitHub OIDC 토큰 발급(키 없는 Google 인증용)

jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 교체 대상 파일의 라이브 내용이 저장소 이력의 어느 버전인지 찾기 위해

      - name: 라이브 사이트 대조
        id: guard
        env:
          EXPECTED: ${{ inputs.expected_changes }}
          LIVE_SHA1: ${{ inputs.live_sha1 }}
        run: |
          python3 - <<'EOF'
          import difflib, hashlib, os, subprocess, sys, urllib.parse, urllib.request
          base = "https://ai-edu-seco.web.app/"
          expected = {s.strip() for s in os.environ.get("EXPECTED", "").split(",") if s.strip()}
          # -z: 한글 파일명을 따옴표·8진수로 감싸지 않은 원래 경로로 받는다
          files = [f for f in subprocess.run(["git", "ls-files", "-z", "public"], capture_output=True,
                                             check=True).stdout.decode("utf-8").split("\0") if f]
          diff, missing = [], []
          for f in files:
              rel = f[len("public/"):]
              if rel.split("/")[-1].startswith("."):
                  continue
              url = base + urllib.parse.quote(rel)
              try:
                  live = urllib.request.urlopen(url, timeout=60).read()
              except Exception as e:
                  missing.append(f"{rel} ({e})")
                  continue
              local = open(f, "rb").read()
              if hashlib.sha1(live).digest() != hashlib.sha1(local).digest():
                  diff.append(rel)
                  if rel not in expected and rel.endswith(".html"):
                      a = local.decode("utf-8", "replace").splitlines()
                      b = live.decode("utf-8", "replace").splitlines()
                      d = list(difflib.unified_diff(a, b, "저장소", "라이브", n=0, lineterm=""))
                      print(f"── {rel}: 저장소 {len(a)}줄 / 라이브 {len(b)}줄, 바뀐 줄 {sum(1 for x in d if x[:1] in '+-') - 2}")
                      for x in d[:60]:
                          print("   " + x[:200])
          print(f"대조 파일 {len(files)}개 — 다름 {len(diff)} · 라이브에 없음 {len(missing)}")
          for r in diff:
              print(("  예상된 변경  " if r in expected else "  ✗ 예상 밖   ") + r)
          for r in missing:
              print("  라이브에 없음 " + r)
          # 교체 대상 파일: 라이브 내용이 저장소 이력의 어떤 커밋본과 같아야 안전하다.
          # 어느 커밋에도 없으면 PC 에서만 고친 내용이 라이브에 있다는 뜻 → 교체하면 사라지므로 배포 금지.
          safe = True
          for rel in sorted(expected):
              path = "public/" + rel
              try:
                  live = urllib.request.urlopen(base + urllib.parse.quote(rel), timeout=60).read()
              except Exception as e:
                  print(f"  교체 대상 {rel}: 라이브에 없음({e}) — 신규 파일로 추가됨")
                  continue
              hit = None
              for h in subprocess.run(["git", "log", "--format=%H", "--", path], capture_output=True,
                                      text=True, check=True).stdout.split():
                  blob = subprocess.run(["git", "show", f"{h}:{path}"], capture_output=True).stdout
                  if hashlib.sha1(blob).digest() == hashlib.sha1(live).digest():
                      hit = h
                      break
              ack = {s.strip().lower() for s in os.environ.get("LIVE_SHA1", "").split(",") if s.strip()}
              if hit:
                  print(f"  교체 대상 {rel}: 라이브 = 저장소 커밋 {hit[:7]} 버전 → 교체 안전")
              elif hashlib.sha1(live).hexdigest() in ack:
                  # 라이브본에 커밋하면 안 되는 내용(평문 명단 등)이 있어 저장소에 그대로 둘 수 없을 때 —
                  # 사람이 3-way 병합으로 라이브 변경을 저장소에 옮겼음을 확인하고 그 해시를 입력한 경우만 허용
                  print(f"  교체 대상 {rel}: 라이브 SHA-1 = 입력한 live_sha1 (수동 대조 완료) → 교체 허용")
              else:
                  safe = False
                  print(f"  ✗ 교체 대상 {rel}: 라이브 내용이 저장소 어느 커밋과도 다름 → 교체하면 라이브 변경이 사라짐")
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write(f"safe={'true' if safe else 'false'}\n")
          unexpected = [r for r in diff if r not in expected]
          if unexpected:
              print("\n참고: 위 ✗ 파일은 라이브가 저장소와 다르다(PC 에서 커밋 없이 배포된 변경일 수 있음).")
              print("부분 배포는 이 파일들을 건드리지 않는다. 저장소에 반영하려면 PC 에서 커밋할 것.")
          else:
              print("\n대조 — 교체 대상 외에는 라이브와 저장소가 같다.")
          if not safe:
              print("\n교체 대상 파일이 안전하지 않아 배포하지 않습니다.")
              sys.exit(1)
          EOF

      - name: Google 인증 (키 없음 — Workload Identity Federation)
        if: inputs.deploy == 'true' && steps.guard.outputs.safe == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/58934449948/locations/global/workloadIdentityPools/github/providers/ai-edu
          service_account: gh-hosting-deploy@ai-edu-seco.iam.gserviceaccount.com

      - name: Hosting 부분 배포 (라이브 복제 + 지정 파일만 교체)
        if: inputs.deploy == 'true' && steps.guard.outputs.safe == 'true'
        env:
          FILES: ${{ inputs.expected_changes }}
        run: |
          pip install --quiet google-auth requests
          python3 - <<'EOF'
          import gzip, hashlib, json, os, re, sys, time
          import google.auth
          import google.auth.transport.requests
          SITE = "ai-edu-seco"
          API = "https://firebasehosting.googleapis.com/v1beta1"
          cred, _ = google.auth.default(scopes=["https://www.googleapis.com/auth/firebase.hosting"])
          s = google.auth.transport.requests.AuthorizedSession(cred)

          def ok(r):
              if r.status_code >= 300:
                  print(r.status_code, r.text[:2000]); sys.exit(1)
              return r.json() if r.content else {}

          files = [f.strip().lstrip("/") for f in os.environ["FILES"].split(",") if f.strip()]
          if not files:
              sys.exit("교체할 파일이 없습니다.")
          for f in files:
              if not os.path.isfile("public/" + f):
                  sys.exit(f"public/{f} 가 저장소에 없습니다.")

          live = ok(s.get(f"{API}/sites/{SITE}/releases", params={"pageSize": 1}))["releases"][0]["version"]["name"]
          print("현재 라이브 버전:", live)

          excl = ["^" + re.escape("/" + f) + "$" for f in files]
          op = ok(s.post(f"{API}/sites/{SITE}/versions:clone",
                         json={"sourceVersion": live, "finalize": False, "exclude": {"regexes": excl}}))
          while not op.get("done"):
              time.sleep(3)
              op = ok(s.get(f"{API}/{op['name']}"))
          if "error" in op:
              print(op["error"]); sys.exit(1)
          ver = op["response"]["name"]
          print("복제 버전:", ver)

          blobs, manifest = {}, {}
          for f in files:
              gz = gzip.compress(open("public/" + f, "rb").read(), mtime=0)
              h = hashlib.sha256(gz).hexdigest()
              blobs[h], manifest["/" + f] = gz, h
          pop = ok(s.post(f"{API}/{ver}:populateFiles", json={"files": manifest}))
          for h in pop.get("uploadRequiredHashes", []):
              ok(s.post(f"{pop['uploadUrl']}/{h}", data=blobs[h],
                        headers={"Content-Type": "application/octet-stream"}))
          print("교체 파일:", ", ".join(manifest))

          ok(s.patch(f"{API}/{ver}", params={"update_mask": "status"}, json={"status": "FINALIZED"}))
          rel = ok(s.post(f"{API}/sites/{SITE}/releases", params={"versionName": ver},
                          json={"message": "부분 배포(GitHub Actions): " + ", ".join(files)}))
          print("릴리스 완료:", rel.get("name"))
          EOF
