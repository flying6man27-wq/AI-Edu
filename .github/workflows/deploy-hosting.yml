# Firebase Hosting 수동 배포 (PC 없이 휴대폰 GitHub 앱에서 실행)
#
# 1) 대조(항상 실행, 자격증명 불필요): 라이브 사이트의 파일을 내려받아 저장소 public/ 과 비교한다.
#    PC 에서 커밋 없이 배포한 변경이 라이브에만 있으면, 이 저장소로 배포할 때 그 변경이 사라진다.
#    그래서 대조에서 차이가 나면 목록을 로그에 남기고, 예상한 파일 외의 차이가 있으면 배포하지 않는다.
# 2) 배포(deploy=true 일 때만): hosting 만 배포한다. Firestore 규칙은 건드리지 않는다.
#    저장소 시크릿 FIREBASE_SERVICE_ACCOUNT(서비스 계정 JSON 전체)가 필요하다.
name: deploy-hosting

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "true 면 대조 통과 후 실제 배포, false 면 대조만"
        required: true
        default: "false"
      expected_changes:
        description: "라이브와 달라도 되는 파일(public/ 기준, 쉼표 구분) — 이번에 배포할 변경"
        required: false
        default: "onboarding/index.html"

permissions:
  contents: read

jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 라이브 사이트 대조
        env:
          EXPECTED: ${{ inputs.expected_changes }}
        run: |
          python3 - <<'EOF'
          import difflib, hashlib, os, subprocess, sys, urllib.parse, urllib.request
          base = "https://ai-edu-seco.web.app/"
          expected = {s.strip() for s in os.environ.get("EXPECTED", "").split(",") if s.strip()}
          # -z: 한글 파일명을 따옴표·8진수로 감싸지 않은 원래 경로로 받는다
          files = [f for f in subprocess.run(["git", "ls-files", "-z", "public"], capture_output=True,
                                             check=True).stdout.decode("utf-8").split("\0") if f]
          diff, missing = [], []
          for f in files:
              rel = f[len("public/"):]
              if rel.split("/")[-1].startswith("."):
                  continue
              url = base + urllib.parse.quote(rel)
              try:
                  live = urllib.request.urlopen(url, timeout=60).read()
              except Exception as e:
                  missing.append(f"{rel} ({e})")
                  continue
              local = open(f, "rb").read()
              if hashlib.sha1(live).digest() != hashlib.sha1(local).digest():
                  diff.append(rel)
                  if rel not in expected and rel.endswith(".html"):
                      a = local.decode("utf-8", "replace").splitlines()
                      b = live.decode("utf-8", "replace").splitlines()
                      d = list(difflib.unified_diff(a, b, "저장소", "라이브", n=0, lineterm=""))
                      print(f"── {rel}: 저장소 {len(a)}줄 / 라이브 {len(b)}줄, 바뀐 줄 {sum(1 for x in d if x[:1] in '+-') - 2}")
                      for x in d[:60]:
                          print("   " + x[:200])
          print(f"대조 파일 {len(files)}개 — 다름 {len(diff)} · 라이브에 없음 {len(missing)}")
          for r in diff:
              print(("  예상된 변경  " if r in expected else "  ✗ 예상 밖   ") + r)
          for r in missing:
              print("  라이브에 없음 " + r)
          unexpected = [r for r in diff if r not in expected]
          if unexpected:
              print("\n예상 밖의 차이가 있습니다 — 라이브에만 있는 변경이 배포로 사라질 수 있어 중단합니다.")
              sys.exit(1)
          print("\n대조 통과 — 예상한 파일만 다릅니다.")
          EOF

      - name: Hosting 배포
        if: inputs.deploy == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "FIREBASE_SERVICE_ACCOUNT 시크릿이 없습니다."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only hosting --project ai-edu-seco --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
