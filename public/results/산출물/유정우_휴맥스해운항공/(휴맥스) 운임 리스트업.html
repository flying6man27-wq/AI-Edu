const W = DATA.weeks;
let TYPE = '40H', FROM = 0, TO = W.length - 1, Q = '';

const el = id => document.getElementById(id);
const fmt = n => (n === null || n === undefined) ? '' : n.toLocaleString();

function weekSlice(){ return W.slice(FROM, TO + 1); }

function deltaSpan(cur, prev){
  if (cur === null || cur === undefined || prev === null || prev === undefined || cur === prev) return '';
  const d = cur - prev;
  return `<span class="d ${d>0?'u':'dn'}">${d>0?'▲':'▼'}${fmt(Math.abs(d))}</span>`;
}

/* 주차 헤더 */
function headHtml(firstLabel){
  let h = `<tr><th class="rowh">${firstLabel}</th>`;
  for (const w of weekSlice()) h += `<th>${w.label}<span class="wr">${w.range}</span></th>`;
  return h + '</tr>';
}

/* 컨테이너 운임 행: weeks[key] = {20,40,40H} */
function rateRows(rows, labelFn){
  const ws = weekSlice();
  let out = '';
  for (const r of rows){
    const name = labelFn(r);
    if (Q && !name.toLowerCase().includes(Q)) continue;
    let tds = '', prev = null, any = false;
    for (const w of ws){
      const cell = r.weeks[w.key];
      const v = cell ? cell[TYPE] : null;
      if (v !== null && v !== undefined) any = true;
      tds += `<td>${v===null||v===undefined ? '<span class="muted">–</span>' : fmt(v) + deltaSpan(v, prev)}</td>`;
      prev = (v===null||v===undefined) ? prev : v;
    }
    if (!any) continue;
    out += `<tr><th class="rowh">${name}</th>${tds}</tr>`;
  }
  return out || `<tr><td class="rowh muted" colspan="${ws.length+1}">조건에 맞는 항로가 없습니다.</td></tr>`;
}

function panel(tag, tagCls, title, desc, tableHtml, legend, note){
  return `<div class="panel">
    <div class="ph"><h2><span class="tag ${tagCls}">${tag}</span>${title}</h2><p>${desc}</p></div>
    ${note ? `<div class="note">${note}</div>` : ''}
    <div class="scroll"><table>${tableHtml}</table></div>
    ${legend ? `<div class="legend">${legend}</div>` : ''}
  </div>`;
}

function renderLCL(){
  const ws = weekSlice();
  let mpRows = '';
  for (const r of DATA.maxpeed){
    const name = `${r.dest} <span class="sm">${r.item} · $/${r.unit}</span>`;
    if (Q && !r.dest.toLowerCase().includes(Q)) continue;
    let tds='', prev=null, any=false;
    for (const w of ws){
      const v = r.weeks[w.key];
      if (v !== null && v !== undefined) any = true;
      tds += `<td>${v===null||v===undefined?'<span class="muted">–</span>':fmt(v)+deltaSpan(v,prev)}</td>`;
      prev = (v===null||v===undefined)?prev:v;
    }
    if (any) mpRows += `<tr><th class="rowh">${name}</th>${tds}</tr>`;
  }
  if (!mpRows) mpRows = `<tr><td class="rowh muted" colspan="${ws.length+1}">조건에 맞는 항로가 없습니다.</td></tr>`;

  let regRows='';
  for (const r of DATA.maxpeed_regional){
    if (Q && !r.name.toLowerCase().includes(Q)) continue;
    let tds='', any=false;
    for (const w of ws){
      const c = r.weeks[w.key];
      if (c){ any=true;
        const s = (c.delta>0?'+':'') + '$' + c.delta;
        tds += `<td>${c.max?'<span class="sm">최대 </span>':''}${s}<span class="sm">/RT</span></td>`;
      } else tds += `<td><span class="muted">–</span></td>`;
    }

  }
  if (!regRows) regRows = `<tr><td class="rowh muted" colspan="${ws.length+1}">조건에 맞는 지역이 없습니다.</td></tr>`;

  const periods = DATA.maxpeed_periods.map(p=>`${p.label}`).join(' · ');

/* ECU LCL */
function ecuRows(filterFn){
  const ws = weekSlice();
  let out = '';
  for (const r of DATA.ecu){
    if (!filterFn(r)) continue;
    const name = `${r.dest} <span class="sm">${r.region||''}</span>`;
    if (Q && !r.dest.toLowerCase().includes(Q)) continue;
    let tds='', prev=null, any=false;
    for (const w of ws){
      const c = r.weeks[w.key];
      const v = c ? c.rate : null;
      if (v !== null && v !== undefined) any = true;
      tds += `<td>${v===null||v===undefined?'<span class="muted">–</span>'
        : (v>0?'':'') + '$' + v + deltaSpan(v, prev)}</td>`;
      prev = (v===null||v===undefined)?prev:v;
    }
    if (any) out += `<tr><th class="rowh">${name}</th>${tds}</tr>`;
  }
  return out || `<tr><td class="rowh muted" colspan="${ws.length+1}">조건에 맞는 항구가 없습니다.</td></tr>`;
}

function findRoute(kind, key){
  if (kind === 'HMM')      return DATA.hmm.find(r => r.code === key);
  if (kind === 'OOCL')     return DATA.oocl.find(r => r.dest === key);
  if (kind === 'ONE')      return DATA.one_sea.find(r => r.dest === key);
  if (kind === 'ONE_EU')   return DATA.one_eu.find(r => r.dest === key);
  if (kind === 'ONE_OC')   return DATA.one_oceania.find(r => r.dest === key);
  if (kind === 'ONE_ME')   return DATA.one_me.find(r => r.dest === key);
  if (kind === 'MAXPEED')  return DATA.maxpeed.filter(r => r.dest === key);
  if (kind === 'MAXPEED_REG') return DATA.maxpeed_regional.find(r => r.name === key);
  if (kind === 'ECU'){
    const [sheet, dest] = key.split('|');
    return DATA.ecu.find(r => r.sheet === sheet && r.dest === dest);
  }
  return null;
}

                OOCL:'t-oocl', MAXPEED:'t-mp', MAXPEED_REG:'t-mp', ECU:'t-ecu'};
const TAGNAME = {HMM:'HMM', ONE:'ONE', ONE_EU:'ONE', ONE_OC:'ONE', ONE_ME:'ONE',
                 OOCL:'OOCL', MAXPEED:'MAXPEED', MAXPEED_REG:'MAXPEED', ECU:'ECU'};

function renderPORT(){
  const ws = weekSlice();
  let html = '';
  for (const g of DATA.port_groups){
    if (Q && !g.port.toLowerCase().includes(Q)) continue;
    let body = '';
    // FCL
    for (const [kind, key] of g.fcl){
      const r = findRoute(kind, key);
      if (!r) continue;
      let tds='', prev=null, any=false;
      for (const w of ws){
        const c = r.weeks[w.key]; const v = c ? c[TYPE] : null;
        if (v!==null&&v!==undefined) any=true;
        tds += `<td>${v===null||v===undefined?'<span class="muted">–</span>':fmt(v)+deltaSpan(v,prev)}</td>`;
        prev = (v===null||v===undefined)?prev:v;
      }
      if (any) body += `<tr><th class="rowh"><span class="tag ${TAGCLS[kind]}">${TAGNAME[kind]}</span>
        <span class="sm">FCL</span> ${TYPE==='40H'?"40'H":TYPE==='40'?"40'":"20'"}</th>${tds}</tr>`;
    }
    // LCL
    for (const [kind, key] of g.lcl){
      const r = findRoute(kind, key);
      if (!r) continue;
      const list = Array.isArray(r) ? r : [r];
      for (const rr of list){
        let tds='', prev=null, any=false;
        for (const w of ws){
          let v = null, disp = null;
          if (kind === 'MAXPEED'){ v = rr.weeks[w.key]; disp = (v===null||v===undefined)?null:fmt(v)+deltaSpan(v,prev); prev=(v===null||v===undefined)?prev:v; }
          else if (kind === 'ECU'){ const c = rr.weeks[w.key]; if (c){ v=c.rate; disp='$'+c.rate+deltaSpan(c.rate,prev); prev=c.rate; } }
          else { const c = rr.weeks[w.key]; if (c){ v=c.delta; disp=(c.max?'<span class="sm">최대 </span>':'')+(c.delta>0?'+':'')+'$'+c.delta; } }
          if (v!==null&&v!==undefined) any=true;
          tds += `<td>${disp===null?'<span class="muted">–</span>':disp}</td>`;
        }
        const unit = kind==='MAXPEED' ? `$/${rr.unit} · ${rr.item}`
                   : kind==='ECU' ? '$/CBM'
                   : '$/RT · 기준 대비 증감';
        if (any) body += `<tr><th class="rowh"><span class="tag ${TAGCLS[kind]}">${TAGNAME[kind]}</span>
          <span class="sm">LCL</span> <span class="sm">${unit}</span></th>${tds}</tr>`;
      }
    }
    if (!body) continue;
    html += `<div class="portcard">
      <div class="porthd">${g.port}<span class="rg">${g.region}</span></div>
      <div class="scroll"><table><thead>${headHtml('선사 / 구분')}</thead><tbody>${body}</tbody></table></div>
    </div>`;
  }
  el('portbody').innerHTML =
    `<div class="panel"><div class="ph">
      <h2>PORT별 FCL · LCL 통합 조회</h2>
      <p>같은 항구에 대해 컨테이너(FCL)와 LCL 운임을 함께 표시합니다. FCL은 USD/Box, LCL은 USD/RT(또는 CBM)로 단위가 다르므로 절대값 비교가 아닌 <b>추세 비교</b>용으로 보시기 바랍니다.</p></div>
      ${html || '<div class="pending">조건에 맞는 항구가 없습니다.</div>'}
      <div class="legend">${LEGEND_DELTA}</div></div>`;
}

/* ---------- 공통 ---------- */
function renderAll(){
  const ws = weekSlice();
  el('meta').textContent = `${ws.length}개 주차 표시 · 기준일 2026-08-13`;
  renderFCL(); renderLCL(); renderPORT();
}

function initWeekSelects(){
  const f = el('fromWeek'), t = el('toWeek');
  W.forEach((w,i)=>{
    f.insertAdjacentHTML('beforeend', `<option value="${i}">${w.label}</option>`);
    t.insertAdjacentHTML('beforeend', `<option value="${i}">${w.label}</option>`);
  });
  f.value = 0; t.value = W.length - 1;
  f.onchange = () => { FROM = +f.value; if (FROM > TO){ TO = FROM; t.value = TO; } renderAll(); };
  t.onchange = () => { TO = +t.value; if (TO < FROM){ FROM = TO; f.value = FROM; } renderAll(); };
}

document.querySelectorAll('.tab').forEach(tb => tb.onclick = () => {
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tabpanel').forEach(x=>x.classList.remove('active'));
  tb.classList.add('active');
  el('panel-' + tb.dataset.tab).classList.add('active');
});
document.querySelectorAll('#fclsub .stab').forEach(s => s.onclick = () => {
  document.querySelectorAll('#fclsub .stab').forEach(x=>x.classList.remove('on'));
  s.classList.add('on'); renderFCL();
});
document.querySelectorAll('#typeseg button').forEach(bt => bt.onclick = () => {
  document.querySelectorAll('#typeseg button').forEach(x=>x.classList.remove('on'));
  bt.classList.add('on'); TYPE = bt.dataset.t; renderAll();
});
el('q').oninput = e => { Q = e.target.value.trim().toLowerCase(); renderAll(); };

el('foot').innerHTML = `데이터 출처: pricing@humexcargo.com 메일함(2026-08-13 스냅샷) 실제 수신 메일 자동 추출 ·
 HMM 북미 9회차 / OOCL 3회차(엑셀) / ONE 동남아 4회차 · 유럽·지중해 4회차 · 호주/뉴질랜드 4회차 · 중동·서남아 1회차 / MAXPEED LCL 4회차 / ECU LCL 7회차<br>
 주차 정의: 월요일 시작 ~ 일요일 종료, 각 달 1일이 포함된 주 = 그 달 1주 · 운임 갱신이 없는 주차는 직전 운임이 이월 표시됩니다.<br>
 출처 메일함: PRICING(HMM·OOCL·MAXPEED·ONE 동남아 5~6월) + harry(ONE 유럽·호주·중동·동남아 7~8월, ECU LCL)`;

initWeekSelects();
renderAll();
</script>
</body>
</html>
