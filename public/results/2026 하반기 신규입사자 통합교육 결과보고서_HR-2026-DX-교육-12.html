const b64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function open_(){
  const msg=document.getElementById('msg'),btn=document.getElementById('go');
  msg.textContent='';btn.disabled=true;btn.textContent='확인 중…';
  try{
    if(!window.crypto||!crypto.subtle)throw new Error('HTTPS 주소에서 열어 주세요');
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const d=b64(P.d);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,d);
    const html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }catch(e){msg.textContent=(e&&e.message&&e.message.indexOf('HTTPS')>=0)?e.message:'암호가 올바르지 않습니다.';btn.disabled=false;btn.textContent='열람';}
}
document.getElementById('go').onclick=open_;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')open_();});
</script></body></html>
